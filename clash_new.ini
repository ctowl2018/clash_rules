;Custom_OpenClash_Rules
;由社区维护的分流规则与防泄漏配置模板 
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;<建议>搭配本项目配套设置，实现最佳化的 OpenClash 使用效果！
;设置方案：https://github.com/Aethersailor/Custom_OpenClash_Rules/wiki/OpenClash-%E8%AE%BE%E7%BD%AE%E6%96%B9%E6%A1%88

;轻量版分流规则
;仅包含基本的分流功能以及基本的直连规则
;适合不需要解锁和分流需求的用户

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;本地地址和域名直连
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve
;自定义规格
;ruleset=REJECT,https://raw.githubusercontent.com/ctowl/clash_rules/refs/heads/dev/rules/reject.list,28800
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/ctowl/clash_rules/refs/heads/dev/rules/Custom_cn.yaml,28800
ruleset=🇨🇳 台湾节点,clash-classic:https://raw.githubusercontent.com/ctowl/clash_rules/refs/heads/dev/rules/Custom_tw.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://raw.githubusercontent.com/ctowl/clash_rules/refs/heads/dev/rules/Custom_gfw.yaml,28800
ruleset=🚀 手动选择,[]GEOSITE,category-porn
ruleset=DIRECT,[]GEOSITE,bing
ruleset=🚀 手动选择,[]GEOSITE,github
;ruleset=☁ 云服务,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OneDrive/OneDrive.yaml,28800
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft_No_Resolve.yaml,28800
;本项目收录的直连规则
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
;国内游戏域名直连
ruleset=DIRECT,[]GEOSITE,category-games@cn
;Steam 下载 CDN 直连
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,28800
;各大游戏平台下载域名直连
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
;BT Tracker 相关域名直连
ruleset=DIRECT,[]GEOSITE,category-public-tracker
ruleset=🚀 手动选择,[]GEOSITE,openai
ruleset=🚀 手动选择,[]GEOSITE,category-ai-!cn
;即时通讯包括了 Telegram/WhatsApp/Line 等海外主流即时通讯软件域名
ruleset=🚀 手动选择,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram_No_Resolve.yaml,28800
ruleset=🚀 手动选择,[]GEOSITE,category-communication
;社交媒体包括了 Twitter(X)/Facebook/Instagram 等海外主流社交媒体
ruleset=🚀 手动选择,[]GEOSITE,category-social-media-!cn
ruleset=🎬️ 短视频,[]GEOSITE,youtube
ruleset=🎬️ 短视频,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTube/YouTube_No_Resolve.yaml,28800
ruleset=🎬️ 短视频,[]GEOSITE,tiktok
ruleset=☁ 云服务,[]GEOSITE,category-speedtest
ruleset=☁ 云服务,[]GEOSITE,apple
ruleset=🇨🇳 台湾节点,[]GEOIP,tw,no-resolve
ruleset=🚀 手动选择,[]GEOSITE,steam
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=🚀 手动选择,[]GEOIP,google,no-resolve

;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geosite:cn 作为国内域名兜底
ruleset=DIRECT,[]GEOSITE,cn
;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geoip:cn 作为国内 IP 兜底
ruleset=DIRECT,[]GEOIP,cn,no-resolve
;以上兜底规则会根据实际情况随时取消

;国内冷门域名会命中漏网之鱼，如影响使用，请设置漏网之鱼直连
;漏网之鱼直连时，无法通过 DNS 泄露测试，但是并不存在泄露
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位结束

;设置节点分组标志位

custom_proxy_group=🚀 手动选择`select`[]🌎 CF新加坡`[]🌎 CF其它优选`[]🇨🇳 台湾节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点
custom_proxy_group=🎬️ 短视频`select`[]🌎 CF新加坡`[]🌎 CF其它优选`[]🇨🇳 台湾节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点
custom_proxy_group=☁ 云服务`select`[]DIRECT`[]🌎 CF新加坡`[]🌎 CF其它优选`[]🇨🇳 台湾节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🌎 CF新加坡`[]🌎 CF其它优选`[]🇨🇳 台湾节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点
custom_proxy_group=🌎 CF新加坡`url-test`(新加坡)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🌎 CF其它优选`url-test`^(?!.*新加坡)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港节点`url-test`(港|🇭🇰)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇨🇳 台湾节点`url-test`(台|🇨🇳)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|🇯🇵)`http://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(🇸🇬|新加坡)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(🇺🇸)`https://cp.cloudflare.com/generate_204`300,,50
;设置分组标志位

;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
